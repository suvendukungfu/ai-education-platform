name: Axion Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: project/backend/package-lock.json

      - name: Install Dependencies
        working-directory: project/backend
        run: npm ci

      - name: Type Check
        working-directory: project/backend
        run: npx tsc --noEmit

      - name: Run Unit Tests
        working-directory: project/backend
        run: npm test

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: project/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: project/frontend
        run: npm ci

      - name: Next.js Lint
        working-directory: project/frontend
        run: npm run lint

      - name: Next.js Build Check
        working-directory: project/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/axion
