[tool.poetry]
name = "axion-ai-engine"
version = "1.0.0"
description = "High-performance AI Orchestrator for the Axion Platform"
authors = ["Axion Intelligence <ssuvendukumar489@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
langchain = "^0.0.339"
openai = "^1.3.5"
redis = "^5.0.1"
pydantic = "^2.5.2"
python-dotenv = "^1.0.0"
requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
