/** Render Blueprint for Axion Intelligence Stack **/
services:
  # 1. Postgres Database
  - type: database
    name: axion-db
    databaseName: axion
    user: postgres
    plan: free

  # 2. Redis for Rate Limiting & Caching
  - type: redis
    name: axion-cache
    ipAllowList: [] # Flexible for all internal services
    plan: free

  # 3. AI Engine (Python FastAPI)
  - type: web
    name: axion-ai-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    plan: free
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false # User to provide in dashboard

  # 4. Backend (Node.js/Express)
  - type: web
    name: axion-backend
    env: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: axion-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: axion-cache
          property: connectionString
      - key: AI_ENGINE_URL
        fromService:
          type: web
          name: axion-ai-engine
          property: host
      - key: FRONTEND_URL
        value: https://axion-intelligence.netlify.app # Predicted Netlify domain
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
